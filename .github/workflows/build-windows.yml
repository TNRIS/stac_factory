name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test GDAL wheel availability
        run: |
        pip install --only-binary=:all: gdal==3.12.2

      - name: Sync dependencies
        run: uv sync

      - name: Install Nuitka
        run: uv pip install nuitka

      - name: Build
        run: |
          uv run python -m nuitka `
            --standalone `
            --follow-imports `
            --enable-plugin=numpy `
            --include-package=stac_factory `
            --include-package=osgeo `
            --include-package=psycopg `
            --output-dir=dist `
            src/stac_factory/main.py

      - name: Compress output
        run: |
          Compress-Archive `
            -Path dist\main.dist `
            -DestinationPath dist\itemvalidator-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: itemvalidator-windows
          path: dist/itemvalidator-windows.zip